services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: evervault-app:prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Defaults to 38378 with no .env; set HOST_PORT=80 on the server (Cloudflare origin).
      - "${HOST_PORT:-38378}:38378"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Browser uses same-origin "/api"; server-side uses the in-container backend.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:38372/api}
      # Backend → Postgres (sibling service, passwordless trust auth, never exposed).
      ConnectionStrings__Default: "Host=db;Port=5432;Database=evervault;Username=postgres"
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: evervault
      POSTGRES_USER: postgres
      # Passwordless: the port is never published, only the app on this network can reach it.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # PostgreSQL 18+ stores data in a version subdir, so the mount goes at
      # /var/lib/postgresql (NOT /var/lib/postgresql/data). Named volume persists
      # across image rebuilds / container recreation (survives `make up` of a new version).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evervault"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
