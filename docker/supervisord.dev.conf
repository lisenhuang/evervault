[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:api]
command=dotnet watch run --project /workspace/backend/Evervault.Api/Evervault.Api.csproj --non-interactive
directory=/workspace/backend/Evervault.Api
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_URLS="http://127.0.0.1:38372",ASPNETCORE_ENVIRONMENT="Development",DOTNET_USE_POLLING_FILE_WATCHER="1",DOTNET_WATCH_RESTART_ON_RUDE_EDIT="1"

[program:web]
command=pnpm dev
directory=/workspace/web
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="development",PORT="38373",HOSTNAME="127.0.0.1",WATCHPACK_POLLING="true",CHOKIDAR_USEPOLLING="true"

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
