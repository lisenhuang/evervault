worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket upgrade: "upgrade" when an Upgrade header is present, else "" (close).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Preserve Cloudflare's scheme: if X-Forwarded-Proto is already set (https at the
    # edge), pass it through; otherwise fall back to the origin hop's scheme (http).
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # keepalive holds idle connections open to each upstream instead of opening a fresh TCP connection
    # per request. Without it every /api call — and a single chat turn makes many — costs a new loopback
    # connect plus a socket left in TIME_WAIT, so a burst can exhaust ephemeral ports and start failing
    # connects, which nginx reports as a 502. Safe with the Connection header below: the $connection_upgrade
    # map already sends an empty value for non-WebSocket requests, which is what keepalive requires.
    upstream dotnetapi { server 127.0.0.1:38372; keepalive 32; }   # .NET backend (under /api)
    upstream nextjs    { server 127.0.0.1:38373; keepalive 32; }   # Next.js web

    server {
        listen 38378;
        server_name _;

        client_max_body_size 50m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # --- .NET API under /api (prefix NOT stripped; backend uses UsePathBase("/api")) ---
        # NOTE: proxy_pass has NO trailing slash/URI, so the original /api/... URI is
        # forwarded unchanged. Adding a trailing slash would strip /api and break PathBase.
        location /api/ {
            proxy_pass http://dotnetapi;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;          # long-lived /api/ws/* sockets
            proxy_send_timeout 3600s;
        }

        # --- Next.js dev HMR websocket ---
        location /_next/webpack-hmr {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # --- Everything else -> Next.js ---
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
