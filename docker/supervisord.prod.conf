[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:api]
command=dotnet /app/api/Evervault.Api.dll
directory=/app/api
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_URLS="http://127.0.0.1:38372",ASPNETCORE_ENVIRONMENT="Production"

[program:web]
command=node server.js
directory=/app/web
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="38373",HOSTNAME="127.0.0.1"

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
; nginx starts alongside the upstreams and will 502 until api/web are listening.
; This self-heals within a few seconds (proxy_pass to a literal host:port is resolved
; per-request, so nginx itself starts fine while upstreams are still booting).
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
